trigger: none # https://aka.ms/obpipelines/triggers

resources:
  pipelines:
  - pipeline: onebranch
    source: Official.xdp-for-windows
    trigger: true

name: 0.$(Date:yyyy).$(Date:MM).$(DayOfMonth).$(Rev:rr).0

parameters:
- name: platforms
  type: object
  default:
  - x64

# The official build only publishes Release artifacts.
- name: configurations
  type: object
  default:
  - Release

- name: oses
  type: object
  default:
  - 2022
  - 2025

- name: ebpfVersions
  type: object
  default:
  - '1.3.0'
  - '1.4.0'

- name: stressModes
  type: object
  default:
  - name: XDPMP
    driver: XDPMP
    txInspect: false
  - name: XDPMP_TxInspect
    driver: XDPMP
    txInspect: true
  - name: FNMP
    driver: FNMP
    txInspect: false

variables:
  spinxskRuntime: 60
  spinxskTimeout: 75
  spinxskJobTimeout: 120
  functionalRuntime: 360
  functionalJobTimeout: 420
  functionalIterations: 10

stages:
  - ${{ each platform in parameters.platforms }}:
    - ${{ each config in parameters.configurations }}:
      - stage: build_${{platform}}_${{config}}
        displayName: Build (${{platform}}_${{config}})
        dependsOn: []
        jobs:
        - template: ./templates/build.yml
          parameters:
            platform: ${{platform}}
            config: ${{config}}

      - ${{ each os in parameters.oses }}:
        - stage: functional_${{os}}_${{platform}}_${{config}}
          displayName: Functional ${{os}} (${{platform}}_${{config}})
          dependsOn:
          - build_${{platform}}_${{config}}
          jobs:
          - ${{ each ebpf in parameters.ebpfVersions }}:
            - template: ./templates/tests.yml
              parameters:
                pool: XDP-CI-1ES-Functional-2
                image: WS${{os}}-Functional
                platform: ${{platform}}
                config: ${{config}}
                osName: ${{os}}
                timeoutInMinutes: ${{ variables.functionalRuntime }}
                jobTimeoutInMinutes: ${{ variables.functionalJobTimeout }}
                iterations: ${{ variables.functionalIterations }}
                ebpfVersion: ${{ ebpf }}
                ebpfPreinstalled: ${{ eq(os, 'Prerelease') }}
                xdpInstaller: NuGet

        - stage: stress_${{os}}_${{platform}}_${{config}}
          displayName: Stress ${{os}} (${{platform}}_${{config}})
          dependsOn:
          - build_${{platform}}_${{config}}
          jobs:
          - ${{ each mode in parameters.stressModes }}:
            - template: ./templates/spinxsk.yml
              parameters:
                pool: XDP-CI-1ES-Spinxsk-2
                image: WS${{os}}-Spinxsk
                platform: ${{platform}}
                config: ${{config}}
                osName: ${{os}}
                modeName: ${{ mode.name }}
                testDriver: ${{ mode.driver }}
                txInspect: ${{ mode.txInspect }}
                runtimeMinutes: ${{ variables.spinxskRuntime }}
                timeoutMinutes: ${{ variables.spinxskTimeout }}
                jobTimeoutMinutes: ${{ variables.spinxskJobTimeout }}
                xdpmpPollProvider: FNDIS
                ebpfPreinstalled: ${{ eq(os, 'Prerelease') }}
                xdpInstaller: NuGet

        - stage: samples_${{os}}_${{platform}}_${{config}}
          displayName: Samples ${{os}} (${{platform}}_${{config}})
          dependsOn:
          - build_${{platform}}_${{config}}
          jobs:
          - template: ./templates/samples.yml
            parameters:
              platform: ${{platform}}
              config: ${{config}}
              osName: ${{os}}

        - stage: pktfuzz_${{os}}_${{platform}}_${{config}}
          displayName: Packet parser fuzz ${{os}} (${{platform}}_${{config}})
          dependsOn:
          - build_${{platform}}_${{config}}
          jobs:
          - template: ./templates/pktfuzz.yml
            parameters:
              platform: ${{platform}}
              config: ${{config}}
              osName: ${{os}}
