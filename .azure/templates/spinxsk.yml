# This template runs spinxsk.exe for a single architecture.

parameters:
- name: pool
  default: ''
- name: image
  default: ''
- name: platform
  default: 'x64'
- name: config
  default: 'Debug'
- name: ignoreFailures
  type: boolean
  default: false
- name: runtimeMinutes
  type: number
  default: 10
- name: timeoutMinutes
  type: number
  default: 15
- name: jobTimeoutMinutes
  type: number
  default: 25
- name: successThresholdPercent
  type: number
  default: 1
- name: xdpmpPollProvider
  default: 'NDIS'
- name: osName
- name: xdpInstaller
  default: 'NuGet'
- name: testDriver
  default: XDPMP
- name: modeName
  default: XDPMP
- name: txInspect
  type: boolean
  default: false
- name: ebpfPreinstalled
  type: boolean
  default: false

jobs:
- job: spinxsk_${{ parameters.platform }}_${{ parameters.config }}_${{ parameters.osName }}_${{ parameters.modeName }}
  displayName: spinxsk-${{ parameters.osName }}-${{ parameters.platform }}_${{ parameters.config }}-${{ parameters.modeName }}

  # Either run on our self-hosted 'pool' or an AZP managed 'image'.
  ${{ if ne(parameters.pool, '') }}:
    pool:
      name: ${{ parameters.pool }}
      ${{ if ne(parameters.image, '') }}:
        demands: ImageOverride -equals ${{ parameters.image }}
    workspace:
      clean: all
  ${{ if eq(parameters.pool, '') }}:
    pool:
      vmImage: ${{ parameters.image }}
  continueOnError: ${{ parameters.ignoreFailures }}
  variables:
    runCodesignValidationInjection: false
    logMode: 'File'
    platconfig: ${{ parameters.platform }}_${{ parameters.config }}
  timeoutInMinutes: ${{ parameters.jobTimeoutMinutes }}
  cancelTimeoutInMinutes: 30
  steps:
  - checkout: self
    persistCredentials: true

  - template: checkout-product.yml

  - task: PowerShell@2
    displayName: Check Initial Drivers
    inputs:
      filePath: tools/check-drivers.ps1
      arguments: -Verbose -Config ${{ parameters.config }} -Platform ${{ parameters.platform }} -AllowEbpf

  - task: PowerShell@2
    displayName: Prepare Machine
    inputs:
      filePath: tools/prepare-machine.ps1
      arguments: -ForSpinxskTest -RequireNoReboot -Platform ${{ parameters.platform }} -Verbose
        -EbpfPreinstalled:$${{ parameters.ebpfPreinstalled }} -UsePrivateEbpfStack:$${{ parameters.ebpfPreinstalled }}

  - task: DownloadPipelineArtifact@2
    displayName: Download Build Artifacts
    inputs:
      artifactName: bin_$(platconfig)
      downloadPath: $(Build.SourcesDirectory)/artifacts/bin/$(platconfig)

  - task: PowerShell@2
    displayName: Run spinxsk
    timeoutInMinutes: ${{ parameters.timeoutMinutes }}
    continueOnError: ${{ parameters.ignoreFailures }}
    inputs:
      filePath: tools/spinxsk.ps1
      arguments: -Config ${{ parameters.config }} -Platform ${{ parameters.platform }} -QueueCount 2 -Driver ${{ parameters.testDriver }}
        -Minutes ${{ parameters.runtimeMinutes }} -XdpmpPollProvider ${{ parameters.xdpmpPollProvider }}
        -Verbose -Stats -SuccessThresholdPercent ${{ parameters.successThresholdPercent }}
        -EnableEbpf -XdpInstaller ${{ parameters.xdpInstaller }} -TxInspect:$${{ parameters.txInspect }}
        -EbpfPreinstalled:$${{ parameters.ebpfPreinstalled }}

  - task: PowerShell@2
    displayName: Convert logs
    timeoutInMinutes: 15
    condition: failed()
    inputs:
      filePath: tools/log.ps1
      arguments: -Convert -Name spinxsk_${{ parameters.testDriver }} -Verbose -Config ${{ parameters.config }} -Platform ${{ parameters.platform }}

  - task: PowerShell@2
    displayName: Check Drivers
    condition: always()
    timeoutInMinutes: 5
    inputs:
      filePath: tools/check-drivers.ps1
      arguments: -Verbose -Config ${{ parameters.config }} -Platform ${{ parameters.platform }} -AllowEbpf:$${{ parameters.ebpfPreinstalled }}

  - task: PublishPipelineArtifact@1
    displayName: Upload Logs
    condition: always()
    inputs:
      artifact: logs_stress_${{ parameters.osName }}_${{ parameters.platform }}_${{ parameters.config }}_${{ parameters.modeName }}_$(System.JobAttempt)
      targetPath: $(Build.SourcesDirectory)/artifacts/logs
