# Builds and tests run against the XDP commit used by the selected official build.
# The official pipeline's own sourceCommit belongs to its orchestration repo, not XDP.
parameters:
  submodules: false
  usePipelineTools: true

steps:
- task: PowerShell@2
  displayName: Check out official product source
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
  inputs:
    targetType: inline
    script: |
      $ErrorActionPreference = 'Stop'
      $Uri = "$(System.CollectionUri)$(System.TeamProjectId)/_apis/pipelines/$(resources.pipeline.onebranch.pipelineID)/runs/$(resources.pipeline.onebranch.runID)?api-version=7.1"
      $Run = Invoke-RestMethod -Uri $Uri -Headers @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }
      $Product = $Run.resources.repositories.'xdp-for-windows'
      if ($Product.repository.id -ne "$(Build.Repository.ID)" -or $Product.version -notmatch '^[0-9a-f]{40}$') {
          throw "Official run does not identify a valid commit in the XDP repository."
      }
      $Commit = $Product.version
      git fetch --no-tags origin $Commit
      if ($LASTEXITCODE -ne 0) { throw "Fetching official XDP commit failed: $LASTEXITCODE" }
      git checkout --detach $Commit
      if ($LASTEXITCODE -ne 0) { throw "Checking out official XDP commit failed: $LASTEXITCODE" }
      if ("${{ parameters.submodules }}" -eq "True") {
          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw "Updating product submodules failed: $LASTEXITCODE" }
      }
      if ("${{ parameters.usePipelineTools }}" -eq "True") {
          # Use this pipeline's test scripts so they can be fixed without a new official build.
          git restore --source="$(Build.SourceVersion)" --worktree -- tools
          if ($LASTEXITCODE -ne 0) { throw "Restoring the pipeline's test harness failed: $LASTEXITCODE" }
      }
      Write-Host "Official XDP source: $($Product.refName) at $Commit"
      # Runs are queued on this pipeline's own branch, so label them with the
      # tested ref; PR builds would otherwise look like runs of main.
      $Label = $Product.refName -replace '^refs/pull/(\d+)/merge$', 'pr$1' -replace '^refs/heads/', '' -replace '[^\w.-]', '_'
      Write-Host "##vso[build.addbuildtag]$Label"
      if (-not "$(Build.BuildNumber)".EndsWith("-$Label")) {
          Write-Host "##vso[build.updatebuildnumber]$(Build.BuildNumber)-$Label"
      }
