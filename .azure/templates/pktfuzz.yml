parameters:
  platform: x64
  config: Release
  osName: 2022

jobs:
- job: pktfuzz_${{ parameters.osName }}_${{ parameters.platform }}_${{ parameters.config }}
  displayName: pktfuzz-${{ parameters.osName }}-${{ parameters.platform }}_${{ parameters.config }}
  pool:
    vmImage: windows-${{ parameters.osName }}
  timeoutInMinutes: 30
  steps:
  - checkout: self
    persistCredentials: true

  - template: checkout-product.yml

  - task: DownloadPipelineArtifact@2
    displayName: Download Build Artifacts
    inputs:
      artifactName: bin_${{ parameters.platform }}_${{ parameters.config }}
      downloadPath: $(Build.SourcesDirectory)/artifacts/bin/${{ parameters.platform }}_${{ parameters.config }}

  - task: PowerShell@2
    displayName: Run pktfuzz
    timeoutInMinutes: 15
    inputs:
      filePath: tools/pktfuzz.ps1
      arguments: -Minutes 10 -Workers 8 -Config ${{ parameters.config }} -Platform ${{ parameters.platform }} -Verbose

  - task: PublishPipelineArtifact@1
    displayName: Upload Logs
    condition: always()
    inputs:
      artifact: logs_pktfuzz_${{ parameters.osName }}_${{ parameters.platform }}_${{ parameters.config }}_$(System.JobAttempt)
      targetPath: $(Build.SourcesDirectory)/artifacts/logs
