# This template runs xdpfunctionaltests.dll for a single architecture.

parameters:
  pool: ''
  image: ''
  platform: 'x64'
  config: 'Debug'
  ignoreFailures: false
  timeoutInMinutes: 10
  jobTimeoutInMinutes: 70
  iterations: 1
  osName:
  xdpInstaller: 'NuGet'
  ebpfVersion: '1.4.0'
  ebpfPreinstalled: false

jobs:
- job: tests_${{ parameters.platform }}_${{ parameters.config }}_${{ parameters.osName }}_ebpf${{ replace(parameters.ebpfVersion, '.', '_') }}
  displayName: functional-${{ parameters.osName }}-${{ parameters.platform }}_${{ parameters.config }}-ebpf${{ parameters.ebpfVersion }}
  # Either run on our self-hosted 'pool' or an AZP managed 'image'.
  ${{ if ne(parameters.pool, '') }}:
    pool:
      name: ${{ parameters.pool }}
      ${{ if ne(parameters.image, '') }}:
        demands: ImageOverride -equals ${{ parameters.image }}
    workspace:
      clean: all
  ${{ if eq(parameters.pool, '') }}:
    pool:
      vmImage: ${{ parameters.image }}
  continueOnError: ${{ parameters.ignoreFailures }}
  variables:
    runCodesignValidationInjection: false
    platconfig: ${{ parameters.platform }}_${{ parameters.config }}
  timeoutInMinutes: ${{ parameters.jobTimeoutInMinutes }}
  cancelTimeoutInMinutes: 30
  steps:
  - checkout: self
    persistCredentials: true

  - template: checkout-product.yml

  - task: PowerShell@2
    displayName: Check Initial Drivers
    inputs:
      filePath: tools/check-drivers.ps1
      arguments: -Verbose -Config ${{ parameters.config }} -Platform ${{ parameters.platform }} -AllowEbpf

  - task: PowerShell@2
    displayName: Prepare Machine
    inputs:
      filePath: tools/prepare-machine.ps1
      arguments: -ForFunctionalTest -RequireNoReboot -Platform ${{ parameters.platform }} -Verbose
        -EbpfVersion ${{ parameters.ebpfVersion }} -EbpfPreinstalled:$${{ parameters.ebpfPreinstalled }}
        -UsePrivateEbpfStack:$${{ parameters.ebpfPreinstalled }}

  - task: DownloadPipelineArtifact@2
    displayName: Download Build Artifacts
    inputs:
      artifactName: bin_$(platconfig)
      downloadPath: $(Build.SourcesDirectory)/artifacts/bin/$(platconfig)

  - task: PowerShell@2
    displayName: Run Tests
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    inputs:
      filePath: tools/functional.ps1
      arguments: -Verbose -Config ${{ parameters.config }} -Platform ${{ parameters.platform }}
        -Iterations ${{ parameters.iterations }} -Timeout ${{ parameters.timeoutInMinutes }} -XdpInstaller ${{ parameters.xdpInstaller }}
        -EbpfVersion ${{ parameters.ebpfVersion }} -EbpfPreinstalled:$${{ parameters.ebpfPreinstalled }}

  - task: PowerShell@2
    displayName: Convert Logs
    condition: failed()
    timeoutInMinutes: 15
    inputs:
      filePath: tools/log.ps1
      arguments: -Convert -Name xdpfunc* -Verbose -Config ${{ parameters.config }} -Platform ${{ parameters.platform }}

  - task: PublishTestResults@2
    displayName: Publish Test Results
    condition: always()
    inputs:
      testRunner: VSTest
      testResultsFiles: '*.trx'
      searchFolder: artifacts/logs
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true
      failTaskOnFailureToPublishResults: true
      testRunTitle: functional-${{ parameters.osName }}-${{ parameters.platform }}_${{ parameters.config }}-ebpf${{ parameters.ebpfVersion }}

  - task: PowerShell@2
    displayName: Check Drivers
    condition: always()
    timeoutInMinutes: 5
    inputs:
      filePath: tools/check-drivers.ps1
      arguments: -Verbose -Config ${{ parameters.config }} -Platform ${{ parameters.platform }} -AllowEbpf:$${{ parameters.ebpfPreinstalled }}

  - task: PublishPipelineArtifact@1
    displayName: Upload Logs
    condition: always()
    inputs:
      artifact: logs_functional_${{ parameters.osName }}_${{ parameters.platform }}_${{ parameters.config }}_ebpf${{ parameters.ebpfVersion }}_$(System.JobAttempt)
      targetPath: $(Build.SourcesDirectory)/artifacts/logs
