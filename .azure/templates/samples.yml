parameters:
  platform: x64
  config: Release
  osName: 2022

jobs:
- job: samples_${{ parameters.osName }}_${{ parameters.platform }}_${{ parameters.config }}
  displayName: Sample integration ${{ parameters.osName }}
  pool:
    name: XDP-CI-1ES-Functional-2
    demands: ImageOverride -equals WS${{ parameters.osName }}-Functional
  workspace:
    clean: all
  timeoutInMinutes: 90
  cancelTimeoutInMinutes: 30
  variables:
    runCodesignValidationInjection: false
  steps:
  - checkout: self
    persistCredentials: true

  - template: checkout-product.yml

  - task: PowerShell@2
    displayName: Check Initial Drivers
    inputs:
      filePath: tools/check-drivers.ps1
      arguments: -Config ${{ parameters.config }} -Platform ${{ parameters.platform }} -Verbose -AllowEbpf

  - task: PowerShell@2
    displayName: Prepare Machine
    inputs:
      filePath: tools/prepare-machine.ps1
      arguments: -ForFunctionalTest -Platform ${{ parameters.platform }} -RequireNoReboot -Verbose

  - task: DownloadPipelineArtifact@2
    displayName: Download Build Artifacts
    inputs:
      artifactName: bin_${{ parameters.platform }}_${{ parameters.config }}
      downloadPath: $(Build.SourcesDirectory)/artifacts/bin/${{ parameters.platform }}_${{ parameters.config }}

  - task: PowerShell@2
    displayName: Kernel forwarding
    timeoutInMinutes: 10
    inputs:
      filePath: tools/xskfwdkm.ps1
      arguments: -Config ${{ parameters.config }} -Platform ${{ parameters.platform }} -Verbose

  - task: PowerShell@2
    displayName: XSKMAP redirect
    timeoutInMinutes: 10
    inputs:
      filePath: tools/xskmaprx.ps1
      arguments: -Config ${{ parameters.config }} -Platform ${{ parameters.platform }} -TimeoutSeconds 10 -Verbose

  - task: PowerShell@2
    displayName: Restricted socket access
    timeoutInMinutes: 10
    inputs:
      filePath: tools/xskrestricted.ps1
      arguments: -Config ${{ parameters.config }} -Platform ${{ parameters.platform }} -TimeoutSeconds 10 -LogMode Memory -Verbose

  - task: PowerShell@2
    displayName: Deprecated restricted socket access
    timeoutInMinutes: 10
    inputs:
      filePath: tools/xskrestricted.ps1
      arguments: -Config ${{ parameters.config }} -Platform ${{ parameters.platform }} -TimeoutSeconds 10 -LogMode Memory -Deprecated -Verbose

  - task: PowerShell@2
    displayName: RX filter
    timeoutInMinutes: 10
    inputs:
      filePath: tools/rxfilter.ps1
      arguments: -Config ${{ parameters.config }} -Platform ${{ parameters.platform }} -Duration 1 -LogMode Memory -Verbose

  - task: PowerShell@2
    displayName: User forwarding
    timeoutInMinutes: 10
    inputs:
      filePath: tools/xskfwd.ps1
      arguments: -Config ${{ parameters.config }} -Platform ${{ parameters.platform }} -Duration 1 -LogMode Memory -Verbose

  - task: PowerShell@2
    displayName: Check Drivers
    condition: always()
    timeoutInMinutes: 5
    inputs:
      filePath: tools/check-drivers.ps1
      arguments: -Config ${{ parameters.config }} -Platform ${{ parameters.platform }} -Verbose

  - task: PublishPipelineArtifact@1
    displayName: Upload Logs
    condition: always()
    inputs:
      artifact: logs_samples_${{ parameters.osName }}_${{ parameters.platform }}_${{ parameters.config }}_$(System.JobAttempt)
      targetPath: $(Build.SourcesDirectory)/artifacts/logs
