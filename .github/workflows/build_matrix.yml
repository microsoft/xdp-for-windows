name: Build XDP Matrix

# The caller is responsible for making sure all options passed to this workflow are valid and compatible with each other.

on:
  workflow_call:
    inputs:
      ref:
        required: false
        default: ''
        type: string
      id:
        required: false
        default: ''
        type: string
      codeql:
        required: false
        default: true
        type: boolean
      os_list:
        # JSON array of OS/VS legs to build. "2022" -> windows-2022 (VS2022);
        # "2025-vs2026" -> windows-2025-vs2026 (WS2025 + VS2026).
        required: false
        default: '["2022", "2025-vs2026"]'
        type: string
  workflow_dispatch:
    inputs:
      ref:
        required: false
        default: ''
        type: string
        description: 'The git commit hash (or HEAD of current branch if left empty) of XDP to build.'
      id:
        required: false
        default: ''
        type: string
        description: 'With multiple builds with duplicate configurations (e.g. Debug_x64_2022), you can append an ID (e.g. Debug_x64_2022_myid).'
      os_list:
        required: false
        default: '["2022", "2025-vs2026"]'
        type: string
        description: 'JSON array of OS/VS legs to build (e.g. ["2022", "2025-vs2026"]).'

jobs:
  build_matrix:
    name: Build ${{ inputs.ref }}
    strategy:
      fail-fast: false
      matrix:
        # 2022 -> windows-2022 (VS2022); 2025-vs2026 -> windows-2025-vs2026 (WS2025 + VS2026).
        # The 2025-vs2026 leg is a build-only validation stage: artifacts and CodeQL are gated
        # to os == 2022, so it neither uploads artifacts nor feeds downstream test jobs.
        os: ${{ fromJSON(inputs.os_list) }}
        config: [Release, Debug]
        platform: [x64, arm64]
    uses: ./.github/workflows/build.yml
    with:
      config: ${{ matrix.config }}
      os: ${{ matrix.os }}
      platform: ${{ matrix.platform }}
      ref: ${{ inputs.ref }}
      codeql: ${{ matrix.os == 2022 && (inputs.codeql || false) && github.event_name == 'schedule' }}
      artifact_path: ${{ matrix.os == 2022 && format('bin_{0}_{1}{2}', matrix.config, matrix.platform, (inputs.id != '' && format('_{0}', inputs.id) || '')) || '' }}
